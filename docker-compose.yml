services:
  postgres:
    image: postgres:16-alpine
    container_name: iphone-duo-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iphone_duo_stock_bot
      TZ: Asia/Bangkok
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d iphone_duo_stock_bot']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: iphone-duo-stock-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the host-facing URL from .env with the compose network one.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iphone_duo_stock_bot?schema=public
      TZ: Asia/Bangkok
    # Apply migrations before the bot starts, every time.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres-data:
